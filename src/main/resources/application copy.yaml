server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 020305
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # password: ???
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
mybatis-plus:
  type-aliases-package: com.syit.entity # 别名扫描包
logging:
  file:
    name: logs/hmdp.log
  level:
    "com.hmdp": debug
